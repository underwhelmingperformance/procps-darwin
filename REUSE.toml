version = 1

# glibc's regular expression code and the gnulib files that it needs outside
# glibc, copied from upstream with the changes marked `procps-darwin`. Their
# headers state the licence in prose.
[[annotations]]
path = "crates/darwin-proc/glibc-regex/**"
SPDX-FileCopyrightText = "1985-2026 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-2.1-or-later"

# regcomp.c and regex_internal.h contain our changes, so they also have our
# copyright line.
[[annotations]]
path = [
  "crates/darwin-proc/glibc-regex/regcomp.c",
  "crates/darwin-proc/glibc-regex/regex_internal.h",
]
SPDX-FileCopyrightText = [
  "1985-2026 Free Software Foundation, Inc.",
  "2026 Iain Lane <iain@orangesquash.org.uk>",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# gnulib's configure writes config.h, and copies into it text from gnulib's m4
# files, whose licence is FSFULLR. A later entry takes precedence, so this
# entry follows the entry for the directory.
[[annotations]]
path = "crates/darwin-proc/glibc-regex/config.h"
SPDX-FileCopyrightText = "2007-2026 Free Software Foundation, Inc."
SPDX-License-Identifier = "FSFULLR"

# cdefs.h has a second copyright holder.
[[annotations]]
path = "crates/darwin-proc/glibc-regex/cdefs.h"
SPDX-FileCopyrightText = [
  "1992-2026 Free Software Foundation, Inc.",
  "The GNU Toolchain Authors",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Tools generate these files, and generated output has no author who could own
# its copyright. NONE records that, and CC0-1.0 waives any right that a
# jurisdiction might still grant.
[[annotations]]
path = [
  "Cargo.lock",
  "crates/procps-harness/golden/**",
  "flake.lock",
  "nix/wrapscallion/sources.json",
  "packaging/launchd/*.plist",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# These golden files contain the usage text of procps-ng's pgrep and pkill. The
# text is from procps-ng's src/pgrep.c, so the files have its copyright holders
# and licence. The procps-harness test in tests/reuse.rs checks that this list
# contains exactly the golden files with the usage text.
[[annotations]]
path = [
  "crates/procps-harness/golden/pgrep/abbreviated-option-with-unwanted-argument.toml",
  "crates/procps-harness/golden/pgrep/ambiguous-long-option-with-value.toml",
  "crates/procps-harness/golden/pgrep/ambiguous-long-option.toml",
  "crates/procps-harness/golden/pgrep/cgroup-comma-list.toml",
  "crates/procps-harness/golden/pgrep/clustered-option-without-argument.toml",
  "crates/procps-harness/golden/pgrep/colon-option.toml",
  "crates/procps-harness/golden/pgrep/comma-list.toml",
  "crates/procps-harness/golden/pgrep/empty-list.toml",
  "crates/procps-harness/golden/pgrep/empty-long-option.toml",
  "crates/procps-harness/golden/pgrep/empty-user-list.toml",
  "crates/procps-harness/golden/pgrep/environment-empty-list.toml",
  "crates/procps-harness/golden/pgrep/help-before-invalid-option.toml",
  "crates/procps-harness/golden/pgrep/help-short.toml",
  "crates/procps-harness/golden/pgrep/help.toml",
  "crates/procps-harness/golden/pgrep/invalid-option.toml",
  "crates/procps-harness/golden/pgrep/inverse-and-newest.toml",
  "crates/procps-harness/golden/pgrep/long-option-with-unwanted-argument.toml",
  "crates/procps-harness/golden/pgrep/long-option-without-argument.toml",
  "crates/procps-harness/golden/pgrep/newest-and-oldest.toml",
