[package]
name = "procps"
description = "procps-ng's ps, top, pgrep and pkill for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert_matches.workspace = true
libtest-mimic.workspace = true
pretty_assertions.workspace = true
procps-harness.workspace = true
rstest.workspace = true
tempfile.workspace = true

# The reference test has its own `main`, so that its binary can also run as the
# harness's session leader and fixture processes.
[[test]]
name = "reference"
harness = false

[dependencies]
clap.workspace = true
darwin-proc.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
