description = "without a pattern, pkill -e with -Q prints each name, because -Q makes procps-ng record each process's name"
command = ["pkill", "-0", "-e", "-Q", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
