description = "without a pattern, pkill -e with --list-full prints each command line, because --list-full makes procps-ng record each process's command line"
command = ["pkill", "-0", "-e", "--list-full", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
