description = "without a pattern, pkill -e prints an empty name, because procps-ng records each process's name only for a pattern, --list-name, --list-full or -Q"
command = ["pkill", "-0", "-e", "-s", "0"]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
