description = "glibc reads a{1}? as (a{1})?, which also matches an empty string"
command = ["pgrep", "-s", "0", "harness-dz{{1}}?5"]

[[fixture]]
name = "n1"
comm = "harness aa"

[[fixture]]
name = "d1"
comm = "harness-d5"
