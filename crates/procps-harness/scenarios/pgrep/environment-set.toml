description = "--env selects the processes that have the variable"
command = ["pgrep", "-s", "0", "--env", "HARNESS_MARK"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
environment = { HARNESS_MARK = "1" }

[[fixture]]
name = "a2"
comm = "harness-alpha"
environment = { HARNESS_MARK = "10" }

[[fixture]]
name = "b1"
comm = "harness-beta"
environment = { HARNESS_OTHER = "1" }
