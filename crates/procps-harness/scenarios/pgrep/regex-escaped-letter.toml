description = "glibc reads an escaped letter that has no special meaning as the letter"
command = ["pgrep", "-s", "0", "harness-\\d5"]

[[fixture]]
name = "n1"
comm = "harness aa"

[[fixture]]
name = "d1"
comm = "harness-d5"
