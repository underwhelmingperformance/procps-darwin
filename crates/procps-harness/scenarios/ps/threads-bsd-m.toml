description = "m lists each process and then its threads, with dashes for the columns of the other kind of row"
command = ["ps", "m", "-o", "pid,tname,bsdtime,args", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2

[[fixture]]
name = "b1"
comm = "harness-beta"
