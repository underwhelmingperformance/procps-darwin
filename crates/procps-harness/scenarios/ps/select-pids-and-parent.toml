description = "-p with another list selects the union, in order of pid"
command = ["ps", "-p", "{b1},{a1}", "--ppid", "{a1}", "-o", "pid=,comm="]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
