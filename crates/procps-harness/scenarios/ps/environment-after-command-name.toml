description = "e shows the environment after the command name too"
command = ["ps", "e", "-o", "comm", "-p", "{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
environment = { HARNESS_A = "one", HARNESS_B = "two" }
