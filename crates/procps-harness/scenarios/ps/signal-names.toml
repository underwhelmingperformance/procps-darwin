description = "--signames shows caught signal names in a left-aligned final column"
command = ["ps", "--signames", "-o", "pid,caught", "-p", "{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
catch = ["SIGHUP", "SIGTERM"]
