description = "BSD's O with sort codes sorts the processes"
command = ["ps", "O-p", "-o", "pid=,comm=", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
