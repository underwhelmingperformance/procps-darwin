description = "a sorted listing with m has a row for each process, with dashes for the columns of threads"
command = ["ps", "m", "--sort=pid", "-o", "pid,stat,comm", "-p", "{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2
