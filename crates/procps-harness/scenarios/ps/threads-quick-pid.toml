description = "-L lists the threads of the processes that -q reads directly"
command = ["ps", "-L", "-o", "pid,comm", "-q", "{b1},{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2

[[fixture]]
name = "b1"
comm = "harness-beta"
