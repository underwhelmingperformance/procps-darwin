description = "a sorted listing with -L has a row for each process, because procps-ng reads threads for sorting only with H"
command = ["ps", "-L", "--sort=-pid", "-o", "pid,nlwp,comm", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2

[[fixture]]
name = "b1"
comm = "harness-beta"
