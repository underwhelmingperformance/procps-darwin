description = "a sorted listing with H has a row for each thread"
command = ["ps", "H", "--sort=-pid", "-o", "pid,comm", "-p", "{a1},{b1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2

[[fixture]]
name = "b1"
comm = "harness-beta"
