description = "BSD's p selects processes by pid"
command = ["ps", "p", "{b1},{a1}", "-o", "pid=,comm="]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
