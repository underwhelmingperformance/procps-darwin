description = "-q lists the processes in the order of the list"
command = ["ps", "-q", "{b1},{a1}", "-o", "pid=,comm="]

[[fixture]]
name = "a1"
comm = "harness-alpha"

[[fixture]]
name = "b1"
comm = "harness-beta"
