description = "--signames with m and a signal mask column makes procps-ng report a bug"
command = ["ps", "m", "--signames", "-o", "pid,caught", "-p", "{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
catch = ["SIGHUP", "SIGTERM"]
