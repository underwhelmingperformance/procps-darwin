description = "m merges the copies of a pid of -q into one process row, because it sorts the tasks by process ID"
command = ["ps", "m", "-o", "pid,comm", "-q", "{a1},{a1},{b1},{a1}"]

[[fixture]]
name = "a1"
comm = "harness-alpha"
threads = 2

[[fixture]]
name = "b1"
comm = "harness-beta"
